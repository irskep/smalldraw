# fly.toml app configuration file for splatterboard-server
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'splatterboard'
primary_region = 'sjc'
swap_size_mb = 2048
kill_signal = 'SIGTERM'
kill_timeout = 20

[build]

[env]
PORT = '3000'
METRICS_PORT = '9091'
NODE_ENV = 'production'
DATABASE_URL = '/data/app.db'
AUTOMERGE_DB_PATH = '/data/automerge.db'

[metrics]
port = 9091
path = '/metrics'

[mounts]
source = 'data'
destination = '/data'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[http_service.concurrency]
type = 'requests'
# Preserve the existing routing threshold; leave the hard limit unset.
soft_limit = 20

[[http_service.checks]]
grace_period = '15s'
interval = '15s'
method = 'GET'
timeout = '5s'
path = '/healthz'

# Serve built files directly from the Machine, bypassing Express.
[[statics]]
guest_path = '/app/apps/server/build/assets'
url_prefix = '/assets'

[[statics]]
guest_path = '/app/apps/server/build/draw'
url_prefix = '/draw'

[[vm]]
size = 'shared-cpu-1x'
memory = '512mb'
