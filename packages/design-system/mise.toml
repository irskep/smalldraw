[tasks.dev]
run = "bun run dev"


[tasks."ts:check"]
run = "bun run ts:check"

[tasks.lint]
run = "bun run lint"

[tasks."lint:fix"]
run = "bun run lint:fix"

[tasks.test]
run = "bun run test"

[tasks."test:ui"]
run = "bun run test:ui:managed"

[tasks."test:ui:managed"]
run = "bunx playwright test"
