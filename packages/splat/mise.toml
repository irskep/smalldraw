[tasks.test]
run = "bun run test"

[tasks."ts:check"]
run = "bun run ts:check"

[tasks.lint]
run = "bun run lint"

[tasks."lint:fix"]
run = "bun run lint:fix"

[tasks."coloring:pipeline"]
run = "python3 ./scripts/coloring_pipeline.py"

[tasks."coloring:prepare-input"]
run = "python3 ./scripts/coloring_pipeline.py prepare-input"

[tasks."coloring:inspect"]
run = "python3 ./scripts/inspect_coloring_book.py"

[tasks."coloring:postprocess-blacks"]
run = "python3 ./scripts/postprocess_black_levels.py"

[tasks."coloring:import-svg"]
run = "uv run --with pymupdf==1.26.7 python ./scripts/import-svg-coloring.py"

[tasks."coloring:import-pdf"]
run = "uv run --with pymupdf==1.26.7 python ./scripts/import-pdf-coloring.py"

[tasks."coloring:test-pipeline"]
run = "uv run --with pymupdf==1.26.7 python scripts/test_coloring_formats.py"

[tasks."coloring:rank"]
run = "uv run --with pymupdf==1.26.7 python scripts/rank-coloring-pages.py"

[tasks."coloring:download"]
run = "python3 ./scripts/download_coloring_sources.py"

[tasks."coloring:test-download"]
run = "python3 ./scripts/test_download_coloring_sources.py"
