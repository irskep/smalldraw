monorepo_root = true

[monorepo]
config_roots = [
  "apps/app",
  "apps/docs-site",
  "apps/server",
  "apps/splat-desktop",
  "apps/splat-web",
  "packages/core",
  "packages/design-system",
  "packages/geometry",
  "packages/renderer-canvas",
  "packages/renderer-raster",
  "packages/server-cli",
  "packages/shared",
  "packages/splat",
  "packages/testing",
]

[settings]
experimental = true

[tools]
bun = "{{ read_file(path='.bun-version') | trim }}"
tilt = "0.37.1"
hk = "2.7.1"
pkl = "0.32.1"
"github:irskep/localci" = "0.2.11"
node = "24"
"pipx:persistproc" = "latest"
"npm:wrangler" = "latest"
"pipx:zensical" = "0.0.71"

[tasks."localci:setup"]
description = "Install dependencies for LocalCI runs"
run = ["mise install", "bun install --frozen-lockfile"]

[tasks."db:push"]
env = { _.file = ".env", DATABASE_URL = "./sqlite/dev.db" }
run = "bunx drizzle-kit push"

[tasks."db:generate"]
env = { _.file = ".env", DATABASE_URL = "./sqlite/dev.db" }
run = "bunx drizzle-kit generate"

[tasks."server:dev"]
dir = "apps/server"
env = { _.file = ".env", DATABASE_URL = "./sqlite/dev.db" }
run = """
export FRONTEND_ORIGINS="$(bash ../../scripts/derive-frontend-origins.sh)"
printf 'server:dev FRONTEND_ORIGINS=%s\n' "$FRONTEND_ORIGINS"
bun run dev
"""

[tasks."server:bootstrap-admin:dev"]
dir = "apps/server"
env = { _.file = ".env", DATABASE_URL = "./sqlite/dev.db", ADMIN_USERNAME = "admin", ADMIN_PASSWORD = "asdfjkl;" }
depends = ["db:push"]
run = "bun run scripts/bootstrap-admin.ts"

[tasks."server:bootstrap-admin:prod"]
dir = "apps/server"
env = { _.file = ".env", NODE_ENV = "production", DATABASE_URL = "./sqlite/prod.db" }
depends = ["db:push:prod"]
run = "bun run scripts/bootstrap-admin.ts"

[tasks."server:promote-admin:prod"]
description = "Promote the existing prod 'admin' user for browser admin access. Requires a deployed image that includes apps/server/scripts."
run = "fly ssh console -a splatterboard -C \"sh -lc 'cd /app && DATABASE_URL=/data/app.db ADMIN_USERNAME=admin bun apps/server/scripts/promote-existing-admin.ts'\""

[tasks."db:studio"]
env = { _.file = ".env", DATABASE_URL = "./sqlite/dev.db" }
run = "bunx drizzle-kit studio"

[tasks."portal:web:dev"]
dir = "apps/app"
env = { VITE_API_URL = "http://localhost:3030/api/v1", VITE_BASE = "/" }
run = "bun run dev"

[tasks."prod:build"]
env = { _.file = ".env", NODE_ENV = "production", DATABASE_URL = "./sqlite/prod.db", DEPLOY_HOST = "splatterboard.app" }
run = "bun run ./scripts/prod-build.ts"

[tasks."prod:serve"]
dir = "apps/server"
env = { _.file = ".env", NODE_ENV = "production", DATABASE_URL = "./sqlite/prod.db" }
run = "bun src/index.ts"

[tasks."splat:web:dev"]
alias = ["splat:dev"]
dir = "apps/splat-web"
env = { _.file = ".env", SPLATTERBOARD_PUBLIC_SYNC_SERVER_HTTP_URL = "http://localhost:3030/api/v1", SPLATTERBOARD_PUBLIC_SYNC_SERVER_WEBSOCKET_URL = "ws://localhost:3030", SPLATTERBOARD_PUBLIC_JOIN_BASE_URL = "http://localhost:3000/draw/", SPLATTERBOARD_PUBLIC_ASSET_BASE_URL = "http://localhost:3030" }
run = "bun run dev"

[tasks."design-system:dev"]
alias = ["ds:dev"]
dir = "packages/design-system"
run = "bun run dev"

[tasks."design-system:ts:check"]
alias = ["ds:ts:check"]
dir = "packages/design-system"
run = "bun run ts:check"

[tasks."design-system:test"]
dir = "packages/design-system"
run = "bun run test"

[tasks."design-system:test:ui"]
alias = ["ds:test:ui"]
dir = "packages/design-system"
env = { PLAYWRIGHT_BASE_URL = "http://127.0.0.1:3002" }
run = "bunx playwright test"

[tasks."design-system:test:ui:headed"]
dir = "packages/design-system"
env = { PLAYWRIGHT_BASE_URL = "http://127.0.0.1:3002" }
run = "bunx playwright test --headed"

[tasks."design-system:test:ui:managed"]
dir = "packages/design-system"
run = "bunx playwright test"

[tasks."design-system:validate"]
alias = ["ds:validate"]
dir = "packages/design-system"
run = "bun run validate"

[tasks."tilt:up"]
run = "tilt up"

[tasks."tilt:down"]
run = "tilt down"

[tasks."update-logo"]
description = "Copy the root logo.svg into browser app favicon assets"
run = """
mkdir -p apps/app/public apps/splat-web/public
cp logo.svg apps/app/public/favicon.svg
cp logo.svg apps/splat-web/public/favicon.svg
cp logo.svg apps/splat-web/src/favicon.svg
"""

[tasks."db:push:prod"]
env = { _.file = ".env", DATABASE_URL = "./sqlite/prod.db" }
run = "bunx drizzle-kit push"

[tasks."ts:check:all"]
alias = ["typecheck"]
run = "bun run ts:check"

[tasks."lint:all"]
run = "bunx oxlint --deny-warnings --report-unused-disable-directives ."

[tasks."lint:fix:all"]
run = "bunx oxlint --fix --deny-warnings ."

[tasks."format:check"]
run = "bun run format:check"

[tasks."format:fix"]
run = "bun run format:fix"

[tasks."fix:all"]
run = ["mise run format:fix", "mise run lint:fix:all"]

[tasks."test:all"]
run = "bun run test:all"

[tasks."build:all"]
run = "bunx pacwich run build --parallel=4"

[tasks."test:ui:all"]
run = "mise run //packages/design-system:test:ui:managed"

[tasks."docs:dev"]
dir = "apps/docs-site"
run = "bun run dev"

[tasks."docs:build"]
dir = "apps/docs-site"
run = "bun run build"

[tasks."splat:web:build"]
run = "mise run //apps/splat-web:build"

[tasks."splat:web:deploy"]
run = "mise run //apps/splat-web:deploy"

[tasks."splat:desktop:dev"]
dir = "apps/splat-desktop"
run = "bun run dev"

[tasks."splat:desktop:build"]
run = "mise run //apps/splat-desktop:build"

[tasks."splat:desktop:package"]
run = "mise run //apps/splat-desktop:package"

[tasks."server:secrets"]
env = { _.file = ".env.prod" }
run = """
fly secrets set \
  OPAQUE_SERVER_SETUP="$OPAQUE_SERVER_SETUP" \
  R2_ACCOUNT_ID="$R2_ACCOUNT_ID" \
  R2_BUCKET="$R2_BUCKET" \
  R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
  R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
  R2_PUBLIC_BASE_URL="$R2_PUBLIC_BASE_URL" \
  -a splatterboard
"""

[tasks."server:deploy"]
description = "Deploy server image. The Docker CMD runs drizzle-kit push against the runtime DATABASE_URL before starting the server."
run = [
  "bun run scripts/check-bun-version.ts",
  "fly deploy -c apps/server/fly.toml --build-arg BUN_VERSION={{ read_file(path='.bun-version') | trim }}",
]

[tasks.deploy]
description = "Build frontends, publish and verify R2 artwork, then deploy the server image. Database migration runs at startup."
run = [
  "mise run prod:build",
  "mise run assets:publish",
  "mise run server:deploy",
]

[tasks."test:browser:wasm"]
description = "Build both production frontends and test binary WASM, persistence, and account recovery in Chromium against a temporary database."
run = "bun run scripts/test-browser-wasm.ts"

[tasks."test:browser:moderation"]
description = "Test real guest sharing, admin inspection, and takedown in Chromium and WebKit against a temporary database."
env = { BROWSER_SUITE = "moderation" }
run = "bun run scripts/test-browser-wasm.ts"

[tasks."test:browser:coloring"]
description = "Check coloring entry, saved drawings, and mobile layout at the supplied origin in Chromium and WebKit."
run = "bun scripts/check-coloring-entry.ts"

[tasks."bench:server:fixtures"]
description = "Generate synthetic Automerge fixtures in /tmp from BENCH_ORIGIN (default local editor)"
run = "bun scripts/benchmarks/export-drawings.ts"

[tasks."bench:server:js"]
description = "Measure Automerge JS and SQLite using the generated fixtures"
run = "bun scripts/benchmarks/automerge-js.ts"

[tasks."bench:server:wasm"]
description = "Measure raw WASM without JS document materialization (diagnostic private API)"
run = "bun scripts/benchmarks/automerge-raw-wasm.ts"

[tasks."bench:server:native"]
description = "Compare matching native Automerge; requires separate Rust 1.90 toolchain"
run = """
cargo +1.90.0 build --release --locked --manifest-path scripts/benchmarks/native-automerge/Cargo.toml
for fixture in small medium large; do
  scripts/benchmarks/native-automerge/target/release/smalldraw-native-bench "/tmp/smalldraw-$fixture.automerge"
done
"""

[tasks."bench:server:encoding"]
description = "Compare current stroke text with immutable values, preserving exact drawing content"
run = "bun scripts/benchmarks/automerge-stroke-encoding.ts"

[tasks."bench:server:fill"]
run = "bun scripts/benchmarks/automerge-fill-encoding.ts"

[tasks."bench:server:import"]
run = "bun scripts/benchmarks/automerge-import.ts"

[tasks."bench:server:cache"]
run = "bun scripts/benchmarks/automerge-cache.ts"

[tasks."bench:server:snapshots"]
run = "bun scripts/benchmarks/automerge-snapshots.ts"

[tasks."bench:server:transport"]
run = "bun scripts/benchmarks/automerge-transport.ts"

[tasks."bench:server:storage-session"]
run = "bun run scripts/benchmarks/backend-storage-session.ts"

[tasks."bench:server:sqlite-indexes"]
run = "bun run scripts/benchmarks/backend-sqlite-indexes.ts"

[tasks."bench:server:load"]
description = "Bounded synthetic guest share/open workload; BENCH_ORIGIN selects the server"
run = "bun run scripts/benchmarks/backend-load.ts"

[tasks."bench:server:sample"]
description = "Read-only production CPU/memory/disk sampling over SSH"
run = "bun run scripts/benchmarks/sample-server.ts"

[tasks."bench:server:checkpoint-delta"]
description = "Compare full versus incremental snapshots after adding a fixture stroke"
run = "bun run scripts/benchmarks/automerge-checkpoint-delta.ts"

[tasks."bench:server:check"]
description = "Type-check and lint the production load measurement tools"
run = [
  "bunx tsc --ignoreConfig --noEmit --module esnext --moduleResolution bundler --target esnext --skipLibCheck --types bun scripts/benchmarks/backend-load.ts scripts/benchmarks/sample-server.ts scripts/benchmarks/automerge-checkpoint-delta.ts scripts/benchmarks/account-checkpoint-load.ts",
  "bunx oxlint --deny-warnings scripts/benchmarks/backend-load.ts scripts/benchmarks/sample-server.ts scripts/benchmarks/automerge-checkpoint-delta.ts scripts/benchmarks/account-checkpoint-load.ts",
]

[tasks."bench:server:account-checkpoints"]
description = "Bounded authenticated full vs incremental checkpoint comparison"
run = "bun run scripts/benchmarks/account-checkpoint-load.ts"

[tasks."lint"]
description = "Lint and check formatting across the workspace"
run = "bun run lint"

[tasks."localci:test"]
run = "bun run test"

[tasks.test]
run = "bun run test"

[tasks."hooks:install"]
description = "Install hk pre-commit checks"
run = "hk install --mise"

[tasks."hooks:check"]
run = "hk check --all"

[tasks."test:docker"]
description = "Build and smoke-test the production image with a disposable database"
depends = ["prod:build"]
run = "bun run scripts/test-docker.ts"

[tasks."coloring:capture-preview"]
description = "Capture the coloring-book header from the running editor, using its fill tool and palette. Optional argument: portal origin."
run = "bun scripts/capture-coloringbook-preview.ts"

[tasks."test:browser:assets"]
description = "Build production frontends and verify galleries, coloring fills, persistence, and stamps in Chromium and WebKit."
env = { BROWSER_SUITE = "assets" }
run = "bun run scripts/test-browser-wasm.ts"

[tasks."assets:prepare"]
description = "Prepare immutable coloring collections and compressed SVG upload files"
run = "bun scripts/prepare-coloring-assets.ts"

[tasks."assets:publish"]
description = "Publish R2 collections, reuse verified receipts, and probe live CDN headers"
env = { _.file = ".env.prod" }
run = "bun scripts/publish-coloring-assets.ts"

[tasks."assets:audit"]
description = "Read-only audit of every prepared coloring asset in R2 and on the public CDN"
env = { _.file = ".env.prod" }
run = "bun scripts/publish-coloring-assets.ts --audit"
